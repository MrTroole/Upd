<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Обновление системы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; background:#000; overflow:hidden; font-family:'Roboto','Segoe UI',-apple-system,sans-serif; color:#fff; }
  body { position:fixed; inset:0; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
            background:#000; padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch;
            padding-top:calc(40px + env(safe-area-inset-top)); padding-bottom:calc(40px + env(safe-area-inset-bottom)); }

  .upd-header { font-size:15px; color:#8a8a8a; letter-spacing:.3px; margin-bottom:44px; }

  .ok-circle { width:96px; height:96px; margin-bottom:30px; }
  .ok-circle-bg { fill:none; stroke:#1f3b2c; stroke-width:3; }
  .ok-circle-fg { fill:none; stroke:#3ddc84; stroke-width:3; stroke-linecap:round;
                  stroke-dasharray:290; stroke-dashoffset:290; animation:draw 1s ease .2s forwards; }
  .ok-mark { fill:none; stroke:#3ddc84; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;
             stroke-dasharray:60; stroke-dashoffset:60; animation:draw .5s ease 1s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  h1 { font-size:22px; font-weight:400; margin-bottom:8px; text-align:center; }
  .version-line { font-size:14px; color:#3ddc84; margin-bottom:34px; letter-spacing:.3px; }

  .info-card { width:min(92vw,420px); background:#111; border:1px solid #1e1e1e; border-radius:16px;
               padding:20px; margin-bottom:16px; flex-shrink:0; }
  .info-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0;
              font-size:14px; border-bottom:1px solid #1c1c1c; }
  .info-row:last-child { border-bottom:none; padding-bottom:0; }
  .info-row:first-child { padding-top:0; }
  .info-row .k { color:#8a8a8a; }
  .info-row .v { color:#e5e5e5; }
  .info-row .v.green { color:#3ddc84; }

  .note { width:min(92vw,420px); font-size:12.5px; color:#6d6d6d; text-align:center;
          line-height:1.6; margin-bottom:34px; flex-shrink:0; }

  .btn { width:min(92vw,420px); padding:15px; border:none; border-radius:26px; background:#ff6a00; color:#fff;
         font-size:16px; font-weight:500; letter-spacing:.4px; cursor:pointer; transition:transform .1s, background .2s;
         flex-shrink:0; margin-top:auto; }
  .btn:active { transform:scale(.98); background:#e85f00; }
</style>
</head>
<body>

<div class="screen">
  <div class="upd-header">Обновление&nbsp;•&nbsp;Redmi</div>

  <svg class="ok-circle" viewBox="0 0 100 100">
    <circle class="ok-circle-bg" cx="50" cy="50" r="46"/>
    <circle class="ok-circle-fg" cx="50" cy="50" r="46"/>
    <path class="ok-mark" d="M30 52 L44 66 L71 37"/>
  </svg>

  <h1>Установлена последняя версия</h1>
  <div class="version-line">MIUI 15.0.2.0.TMHRUXM</div>

  <div class="info-card">
    <div class="info-row"><span class="k">Состояние</span><span class="v green">Актуальная</span></div>
    <div class="info-row"><span class="k">Последняя проверка</span><span class="v">Сегодня</span></div>
    <div class="info-row"><span class="k">Патч безопасности</span><span class="v">сентябрь 2026</span></div>
    <div class="info-row"><span class="k">Устройство</span><span class="v">Redmi</span></div>
  </div>

  <div class="note">Новые обновления устанавливаются автоматически, как только они становятся доступны для этого устройства.</div>

  <button class="btn" id="btn-ok">Хорошо</button>
</div>

<script>
  document.getElementById('btn-ok').addEventListener('click', function(){
    location.href = 'https://ya.ru';
  });
</script>
</body>
</html>
